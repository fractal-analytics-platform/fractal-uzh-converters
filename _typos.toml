[default.extend-identifiers]
# Don't correct these identifiers (matched as whole tokens)
FOV = "FOV"
FOVs = "FOVs"
FoV = "FoV"
PNGs = "PNGs"
LAF = "LAF"  # vendor term in MolecularDevices autofocus reports (raw test data)

[default.extend-words]
# Don't correct the spelling of these words
OME = "OME"
caf = "caf"
nd = "nd"
