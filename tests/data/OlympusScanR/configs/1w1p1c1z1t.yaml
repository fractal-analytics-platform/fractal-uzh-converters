conversion_settings:
  # identifier of the converter to use
  converter: fractal_uzh_converters/olympus_scanr
  # input parameters for the converter
  init_task_kwargs:
    acquisitions:
      - path: tests/data/OlympusScanR/OlympusScanR_reference_acquisitions/1w1p1c1z1t
        acquisition_id: 0
  
# Machine-readable metadata/data about the converted data
# Used to validate the conversion output
multi_plate_assertions:
  plates:
    1w1p1c1z1t.zarr:
      wells: [B/02] # List of wells path in the plate
      images_common: # Common assertions for all images in the plate
        axes: ["c", "z", "y", "x"]
        pixelsize: [1.0, 1.0, 0.325, 0.325]
        types:
          is_3D: false
        attributes:
          acquisition: 0
          plate: 1w1p1c1z1t.zarr
        tables:
          - well_ROI_table
      images:
        B/02/0:
          shape: [1, 1, 2048, 2048]
          attributes:
            well: B02