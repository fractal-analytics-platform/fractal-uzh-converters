name: Update lockfiles

permissions: {}


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 0 5 1 * * 

jobs:
  pixi-update:
    permissions: 
      contents: write       # Needed to write a new PR
      pull-requests: write  # Needed to write a new PR
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true  # Needed for committing on the update-pixi-lock branch
      - uses: prefix-dev/setup-pixi@92815284c57faa15cd896c4d5cfb2d59f32dc43d # v0.8.3
        with:
          run-install: false
      - name: Update lockfiles
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md
      - run: cat diff.md
      - run: |
          git config user.email "pixi-update-lock@example.org"
          git config user.name "pixi-update-lock bot"
          git fetch --all
          git stash
          git switch -c update-pixi-lock
          git checkout stash -- .
          git add pixi.lock
          git commit -m 'Update pixi.lock'
          git push --set-upstream origin update-pixi-lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: gh pr create --title "Update pixi.lock" --body-file diff.md --base main --head update-pixi-lock --label pixi --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}