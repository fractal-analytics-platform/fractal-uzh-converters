# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true


# read more about configuring hatch at:
# https://hatch.pypa.io/latest/config/build/
[tool.hatch.build.targets.wheel]
packages = ["src/fractal_uzh_converters"]

# Clean up the source distribution to avoid big tag.gz files
[tool.hatch.build.targets.sdist]
exclude = [
    # Exclude tests from the source distribution
    "tests",
    # Exclude typically large files and directories that are not needed
    # This might not exists or be named differently in your project
    # TBD if we want to include these or not
    "docs",
    "data",
    "examples",
    "notebooks",
    ".github",
    # Remove all jupyter notebook and checkpoints
    "**/*.ipynb_checkpoints",
    "**/*.ipynb",
    # NB all things in .gitignore are excluded by default of hatchling
]

# Project metadata (see https://peps.python.org/pep-0621)
[project]
name = "fractal-uzh-converters"
dynamic = ["version"]
description = "A collection of fractal tasks to convert HCS Plates to OME-Zarr"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Lorenzo Cerrone", email = "lorenzo.cerrone@uzh.ch" }]
requires-python = ">=3.11,<3.15"

dependencies = [
    # TODO: temporary git ref until the ngio-1.1 migration is released on PyPI
    "ome-zarr-converters-tools[s3] @ git+https://github.com/BioVisionCenter/ome-zarr-converters-tools.git@refactor/ngio-1.1",
    "fractal-task-tools>=0.5.0,<0.6.0",
    # TODO: temporary exact pin for ngio 1.1 pre-release validation
    "ngio==1.1.0a2",
    "fsspec",
    "zarrs",
    "tqdm",
    "tifffile",
    "ome_types",
    "lxml",                                      # hidden dep of ome_types
    "xmltodict",
    "imagecodecs",
]

# Optional dependencies (e.g. for `pip install -e ".[dev]"`, see
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies)
[project.optional-dependencies]
dev = [
    "plotly",
    "notebook",
    "matplotlib",
    "devtools",
    "hatch",
    "pytest",
    "pytest-cov",
    "requests",
    "jsonschema",
    "ruff",
    "ty",
    "pre-commit",
]
test = ["pytest", "pytest-cov", "devtools", "jsonschema", "requests"]
docs = ["mkdocs-material", "mike"]

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

# https://docs.astral.sh/ruff/rules
[tool.ruff.lint]
pydocstyle = { convention = "google" }
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
]
ignore = [
    "D401", # First line should be in imperative mood (remove to opt in)
    "D415", # First line should end with a period (remove to opt in)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 89
skip-magic-trailing-comma = false # default is false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # TODO: drop once ngio forwards `max_workers` from `get_images` to
    # `images_paths` — `plate.get_images(max_workers="auto")` still warns on
    # multi-well plates in ngio 1.1.0a2 despite the opt-in (upstream ngio bug).
    # Fires via the converters-tools snapshot helper, which already opts in
    # correctly.
    "ignore:Plate-wide operations still read one item at a time:ngio.utils.NgioFutureWarning",
    "ignore::zarr.errors.ZarrUserWarning", # required for anndata
    # "ignore::anndata._warnings.ImplicitModificationWarning", # anndata internal index coercion
    "ignore::UserWarning:anndata._io.zarr", # anndata zarr v2→v3 migration notice
]

addopts = [
    "--color=yes",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["fractal_uzh_converters"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
    "pass",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
fractal-uzh-converters = { path = ".", editable = true }
# Local editable dep: v1 is not on PyPI yet. Drop this once v1 is released and
# rely on the [s3]>=1.0.0,<2.0.0 pin in [project.dependencies].
# ome-zarr-converters-tools = { path = "../ome-zarr-converters-tools", editable = true }
# ngio = { path = "../ngio", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.ty.environment]
python = ".pixi/envs/dev"

[tool.pixi.feature.dev.tasks]
ruff-fix-imports = { cmd = "ruff check --select I --fix" }
ruff = { cmd = "ruff format", depends-on = ["ruff-fix-imports"] }
test = { cmd = "pytest", depends-on = ["ruff"] }
chores = { cmd = "pre-commit run --all-files", depends-on = ["test"] }
